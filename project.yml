name: DouDuo
options:
  bundleIdPrefix: me.rrmm
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VLCKitSPM:
    path: Vendor/VLCKit
settings:
  base:
    MARKETING_VERSION: 1.3.1
    CURRENT_PROJECT_VERSION: "42"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  DouDuo:
    type: application
    platform: iOS
    sources:
      - path: DouDuo
    dependencies:
      - package: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo
        PRODUCT_NAME: DouDuo
        INFOPLIST_KEY_CFBundleDisplayName: DouDuo
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 保存视频和图集到相册
    info:
      path: DouDuo/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # 不做后台播放：抖音类短视频退出/切后台就该停声，给了 audio 后台模式反而会继续响
  DouDuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: DouDuoUITests
    dependencies:
      - target: DouDuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.rrmm.douduo.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DouDuo
schemes:
  DouDuo:
    build:
      targets:
        DouDuo: all
        DouDuoUITests: [test]
    test:
      targets:
        - DouDuoUITests
